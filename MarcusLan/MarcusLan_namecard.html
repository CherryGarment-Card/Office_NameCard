<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marcus Lan — Business Card</title>
    
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --bg-paper: #F9F8F6; 
            --card-paper: #FFFFFF; 
            --text-primary: #1C2A3A; 
            --text-secondary: #5A6578; 
            --accent-gold: #C5A059; 
            --accent-gold-light: rgba(197, 160, 89, 0.15); 
            --border-light: #EBE8E1; 
            --bg-dark-blue: #2B3544; 
            --text-light-blue: #7AB2D3; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }
        
        body { 
            background-color: var(--bg-paper); 
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 24px 16px; 
            background-image: radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0); 
            background-size: 24px 24px; 
            overflow-x: hidden; 
        }
        
        .flip-container { width: 100%; max-width: 420px; perspective: 1000px; margin-bottom: 0; cursor: pointer; }
        .flipper { position: relative; width: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        
        .front, .back { width: 100%; background: var(--card-paper); border-radius: 2px; box-shadow: 0 1px 3px rgba(28, 42, 58, 0.04), 0 12px 32px rgba(28, 42, 58, 0.06); border: 1px solid rgba(235, 232, 225, 0.8); -webkit-backface-visibility: hidden; backface-visibility: hidden; position: relative; }
        .front::before, .back::before { content: ''; position: absolute; top: 0; left: 32px; right: 32px; height: 2px; background: var(--accent-gold); opacity: 0.85; }
        
        .front { padding: 44px 32px 36px; z-index: 2; }
        
        .back { 
            position: absolute; 
            top: 0; 
            left: 0; 
            height: 100%; 
            transform: rotateY(180deg); 
            padding: 44px 32px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            gap: 30px; 
        }
        
        .header { margin-bottom: 24px; }
        
        .name-zh {
            font-size: 32px; /* 放大 */
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .name { 
            font-family: 'Cinzel', "Times New Roman", serif; 
            font-size: 20px; /* 縮小 */
            font-weight: 500; 
            color: var(--text-secondary);
            letter-spacing: 1.5px; 
            margin-bottom: 12px; 
        }
        
        .company-section { 
            padding: 20px 0; 
            margin-bottom: 32px; 
            border-top: 1px solid var(--border-light); 
            border-bottom: 1px solid var(--border-light); 
            text-align: center; 
        }
        .company-zh { 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-primary); 
        }
        
        .contact-list { display: flex; flex-direction: column; gap: 22px; margin-bottom: 32px; }
        .contact-item { color: var(--text-primary); display: block; }
        .contact-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; color: var(--accent-gold); margin-bottom: 4px; }
        .contact-val { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
        .contact-subval { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        
        .actions-footer { display: flex; position: relative; z-index: 10; }
        .btn-save { display: block; width: 100%; background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); padding: 12px 16px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s ease; text-align: center; text-decoration: none; }
        .btn-save:hover, .btn-save:active { background-color: var(--accent-gold-light); border-color: var(--accent-gold); color: var(--text-primary); }

        .back-logo-box { 
            width: 100px; 
            height: 100px; 
            background: var(--text-primary); 
            color: #FFF; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-size: 15px; 
            line-height: 1.4; 
            letter-spacing: 1px; 
            border-radius: 2px;
        }
        .logo-line {
            width: 24px;
            height: 2px;
            background-color: #FFF;
            margin: 6px 0;
        }
        .back-address {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .hint-text { 
            width: fit-content; 
            margin: 0 auto; 
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: var(--text-light-blue); 
            padding: 10px 24px; 
            background-color: var(--bg-dark-blue); 
            border: 1px solid rgba(122, 178, 211, 0.3); 
            border-radius: 0 0 4px 4px; 
            box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); 
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; 
            cursor: pointer; 
            animation: pulseAndFloat 2s infinite ease-in-out; 
        }

        .hint-text:active {
            transform: scale(0.95) !important;
            animation: none;
        }

        @keyframes pulseAndFloat { 
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); } 
            50% { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 20px rgba(43, 53, 68, 0.45); } 
        }

        @media (max-width: 360px) { .front, .back { padding: 36px 24px 28px; } .name-zh { font-size: 28px; } .name { font-size: 18px; } }
    </style>
</head>
<body>

    <div class="flip-container" id="cardFlip">
        <div class="flipper">
            
            <!-- 正面 -->
            <div class="front">
                <header class="header">
                    <div class="name-zh">藍旭東</div>
                    <h1 class="name">Marcus Lan</h1>
                </header>
                
                <section class="company-section">
                    <div class="company-zh">Fortune Glory Limited</div>
                </section>
                
                <section class="contact-list">
                    <div class="contact-item">
                        <div class="contact-label">Direct Line</div>
                        <div class="contact-val">+852 6341 3751</div>
                        <div class="contact-val" style="margin-top: 2px;">+852 2943 5230</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-label">Email Address</div>
                        <div class="contact-val">marcus@cherrygroup.com.cn</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-label">Office Location</div>
                        <div class="contact-val">Unit 4608-10, Metroplaza, Tower 2,<br>Kwai Fong, NT, Hong Kong</div>
                        <div class="contact-subval">香港葵芳新都會廣場第2期46樓4608-10室</div>
                    </div>
                </section>
                
                <footer class="actions-footer">
                    <a href="MarcusLan_namecard.vcf" download="MarcusLan_namecard.vcf" class="btn-save" onclick="event.stopPropagation();">
                        Save Contact
                    </a>
                </footer>
            </div>

            <!-- 背面 -->
            <div class="back">
                <div class="back-logo-box">
                    <div class="logo-line"></div>
                    <div>Fortune<br>Glory<br>Limited</div>
                    <div class="logo-line"></div>
                </div>
                <div class="back-address">香港葵芳新都會廣場第2期46樓4608-10室</div>
            </div>

        </div>
    </div>
    
    <div class="hint-text" id="flipBtn">輕觸卡片翻轉</div>

    <script>
        const flipContainer = document.getElementById('cardFlip');
        const flipBtn = document.getElementById('flipBtn');

        flipContainer.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });

        flipBtn.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });
    </script>
</body>
</html>
