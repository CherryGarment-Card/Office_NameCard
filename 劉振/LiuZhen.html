<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peggy Chan — Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-paper: #F9F8F6; 
            --card-paper: #FFFFFF; 
            --text-secondary: #5A6578; 
            --bg-dark-blue: #2B3544; 
            --text-light-blue: #7AB2D3; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }
        body { 
            background-color: var(--bg-paper); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 24px 16px; 
            background-image: radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0); 
            background-size: 24px 24px; 
            overflow-x: hidden; 
        }
        
        /* 翻轉容器：拿掉下方間距，讓按鈕貼齊 */
        .flip-container { 
            width: 100%; 
            max-width: 360px; 
            perspective: 1000px; 
            cursor: pointer; 
            margin-bottom: 0; 
        }
        
        .flipper { 
            position: relative; 
            width: 100%; 
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
            transform-style: preserve-3d; 
        }
        
        .flip-container.flipped .flipper { 
            transform: rotateY(180deg); 
        }
        
        /* 卡片正反面共用設定 */
        .front, .back { 
            width: 100%; 
            aspect-ratio: 0.62; /* 直式比例 */
            background: var(--card-paper); 
            /* 上面保留圓角，下面貼齊按鈕所以直角 */
            border-radius: 4px 4px 0 0; 
            box-shadow: 0 4px 12px rgba(28, 42, 58, 0.08), 0 16px 40px rgba(28, 42, 58, 0.12); 
            border: 1px solid rgba(235, 232, 225, 0.8); 
            border-bottom: none;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden; 
            position: relative; 
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 正面 */
        .front { 
            background-image: url('front.jpg'); 
            z-index: 2; 
        }

        /* 背面 */
        .back { 
            position: absolute; 
            top: 0; 
            left: 0; 
            height: 100%; 
            transform: rotateY(180deg); 
            background-image: url('back.jpg'); 
        }

        /* ========================================= */
        /* 貼齊卡片底部的方形按鈕 */
        /* ========================================= */
        .hint-text { 
            width: fit-content; /* 寬度隨文字縮放 */
            margin: 0 auto; /* 置中 */
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: var(--text-light-blue); 
            padding: 10px 24px; 
            background-color: var(--bg-dark-blue); 
            border: 1px solid rgba(122, 178, 211, 0.3); 
            border-radius: 0 0 4px 4px; /* 只有下面有圓角 */
            box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); 
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; 
            cursor: pointer; 
            animation: pulseAndFloat 2s infinite ease-in-out; 
        }

        .hint-text:active {
            transform: scale(0.95) !important;
            animation: none;
        }

        @keyframes pulseAndFloat { 
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); } 
            50% { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 20px rgba(43, 53, 68, 0.45); } 
        }

    </style>
</head>
<body>

    <div class="flip-container" id="cardFlip">
        <div class="flipper">
            
            <div class="front"></div>

            <div class="back"></div>

        </div>
    </div>
    
    <!-- 替換為可點擊的方形按鈕 -->
    <div class="hint-text" id="flipBtn">輕觸卡片翻轉</div>

    <script>
        const flipContainer = document.getElementById('cardFlip');
        const flipBtn = document.getElementById('flipBtn');

        // 點擊卡片翻轉
        flipContainer.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });

        // 點擊按鈕也翻轉
        flipBtn.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });
    </script>
</body>
</html>
