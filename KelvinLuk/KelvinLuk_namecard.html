<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Luk — Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-paper: #F9F8F6; 
            --card-paper: #FFFFFF; 
            --text-primary: #1C2A3A; 
            --text-secondary: #5A6578; 
            --accent-gold: #C5A059; 
            --accent-gold-light: rgba(197, 160, 89, 0.15); 
            --border-light: #EBE8E1; 
            --bg-dark-blue: #2B3544; 
            --text-light-blue: #7AB2D3; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }
        body { background-color: var(--bg-paper); color: var(--text-primary); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 16px; background-image: radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0); background-size: 24px 24px; overflow-x: hidden; }
        
        .flip-container { width: 100%; max-width: 420px; perspective: 1000px; margin-bottom: 0; cursor: pointer; }
        
        .flipper { position: relative; width: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        
        .front, .back { width: 100%; background: var(--card-paper); border-radius: 2px; box-shadow: 0 1px 3px rgba(28, 42, 58, 0.04), 0 12px 32px rgba(28, 42, 58, 0.06); border: 1px solid rgba(235, 232, 225, 0.8); -webkit-backface-visibility: hidden; backface-visibility: hidden; position: relative; }
        .front::before, .back::before { content: ''; position: absolute; top: 0; left: 32px; right: 32px; height: 2px; background: var(--accent-gold); opacity: 0.85; }
        
        .front { padding: 44px 32px 36px; z-index: 2; }
        .back { position: absolute; top: 0; left: 0; height: 100%; transform: rotateY(180deg); padding: 44px 32px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 40px; }
        
        .header { margin-bottom: 32px; }
        .name { font-family: 'Cinzel', serif; font-size: 30px; font-weight: 600; color: var(--text-primary); letter-spacing: 1px; margin-bottom: 12px; }
        .title-block { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        
        .company-section { padding: 20px 0; margin-bottom: 32px; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .company-item { display: flex; flex-direction: column; justify-content: center; }
        .company-item:first-child { border-right: 1px solid var(--border-light); padding-right: 12px; }
        .company-zh { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .company-en { font-size: 10px; font-weight: 500; color: var(--accent-gold); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
        
        .contact-list { display: flex; flex-direction: column; gap: 22px; margin-bottom: 32px; }
        .contact-item { color: var(--text-primary); display: block; }
        .contact-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; color: var(--accent-gold); margin-bottom: 4px; }
        .contact-val { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
        .contact-subval { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        
        .actions-footer { display: flex; position: relative; z-index: 10; }
        .btn-save { display: block; width: 100%; background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); padding: 12px 16px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s ease; text-align: center; text-decoration: none; }
        .btn-save:hover, .btn-save:active { background-color: var(--accent-gold-light); border-color: var(--accent-gold); color: var(--text-primary); }

        .back-logo-img { max-width: 280px; height: auto; display: block; }
        .back-logo-box { width: 90px; height: 90px; background: var(--text-primary); color: #FFF; display: flex; justify-content: center; align-items: center; font-size: 15px; line-height: 1.2; letter-spacing: 1px; }

        .hint-text { 
            width: fit-content; 
            margin: 0 auto; 
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: var(--text-light-blue); 
            padding: 10px 24px; 
            background-color: var(--bg-dark-blue); 
            border: 1px solid rgba(122, 178, 211, 0.3); 
            border-radius: 0 0 4px 4px; 
            box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); 
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; 
            cursor: pointer; 
            animation: pulseAndFloat 2s infinite ease-in-out; 
        }

        .hint-text:active {
            transform: scale(0.95) !important;
            animation: none;
        }

        @keyframes pulseAndFloat { 
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 8px 16px rgba(43, 53, 68, 0.25); } 
            50% { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 20px rgba(43, 53, 68, 0.45); } 
        }

        @media (max-width: 360px) { .front, .back { padding: 36px 24px 28px; } .name { font-size: 26px; } .company-section { grid-template-columns: 1fr; gap: 16px; text-align: center; } .company-item:first-child { border-right: none; border-bottom: 1px solid var(--border-light); padding-right: 0; padding-bottom: 16px; } }
    </style>
</head>
<body>

    <div class="flip-container" id="cardFlip">
        <div class="flipper">
            
            <div class="front">
                <header class="header">
                    <h1 class="name">Kelvin Luk</h1>
                    <div class="title-block">
                        Director of Fabric and Testing Compliance
                    </div>
                </header>
                <section class="company-section">
                    <div class="company-item">
                        <span class="company-zh">綺麗集團</span>
                        <span class="company-en">Cherry Group</span>
                    </div>
                    <div class="company-item">
                        <span class="company-zh">Fortune Glory Limited</span>
                    </div>
                </section>
                <section class="contact-list">
                    <div class="contact-item">
                        <div class="contact-label">Direct Line</div>
                        <div class="contact-val">+852 2943 5205</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-label">Email Address</div>
                        <div class="contact-val">kelvin.luk@fortunegloryhk.com</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-label">Office Location</div>
                        <div class="contact-val">Unit 4608-10, Metroplaza, Tower 2,<br>Kwai Fong, Hong Kong</div>
                        <div class="contact-subval">香港葵芳新都會廣場第2期46樓4608-10室</div>
                    </div>
                </section>
                <footer class="actions-footer">
                    <a href="Kelvin Luk.vcf" download="Kelvin Luk.vcf" class="btn-save" onclick="event.stopPropagation();">
                        Save Contact
                    </a>
                </footer>
            </div>

            <div class="back">
                <img src="cherry.logo.png" alt="Cherry Group Logo" class="back-logo-img">
                <div class="back-logo-box">FORTUNE<br>GLORY</div>
            </div>

        </div>
    </div>
    
    <div class="hint-text" id="flipBtn">輕觸卡片翻轉</div>

    <script>
        const flipContainer = document.getElementById('cardFlip');
        const flipBtn = document.getElementById('flipBtn');

        flipContainer.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });

        flipBtn.addEventListener('click', function() {
            flipContainer.classList.toggle('flipped');
        });
    </script>
</body>
</html>
